<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor</title>
    <script src="./min/vs/loader.js"></script>
    <style>
        html,
        body,
        #editor {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="editor"></div>
    <script>
        require.config({ paths: { 'vs': './min/vs' } });
        require(['vs/editor/editor.main', 'vs/basic-languages/sql/sql'], function (monaco, sql) {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: [].join('\n'),
                language: 'sql',
                automaticLayout: true,
                wordWrap: 'on',
                minimap: {
                    enabled: false
                }
            });

            const sqlKeywords = sql.language.keywords.map(keyword => ({
                label: keyword.toUpperCase(),
                kind: monaco.languages.CompletionItemKind.Keyword,
                insertText: keyword,
                sortText: `0_${keyword}`
            }));
            allSuggestions = [...sqlKeywords];

            schemaItems = [];
            tableItems = [];
            columnItems = [];
            window.setSchema = function (schema) {
                console.log("Schema loaded:", schema);
                for (const objectSchemaName in schema) {
                    console.log("objectSchemaName:", objectSchemaName);
                    schemaItems.push({
                        label: objectSchemaName,
                        kind: monaco.languages.CompletionItemKind.Struct,
                        insertText: objectSchemaName
                    });
                    for (const tableName in schema[objectSchemaName]) {
                        console.log("tableName:", tableName);
                        const table = schema[objectSchemaName][tableName];
                        tableItems.push({
                            label: `${objectSchemaName}.${tableName}`,
                            kind: monaco.languages.CompletionItemKind.Class,
                            insertText: tableName
                        });

                        const columns = schema[objectSchemaName][tableName];
                        if (Array.isArray(columns)) {
                            columns.forEach(column => {
                                console.log("column:", column);
                                columnItems.push({
                                    label: `${objectSchemaName}.${tableName}.${column}`,
                                    kind: monaco.languages.CompletionItemKind.Field,
                                    insertText: `${column}`
                                });
                            });
                        } else {
                            console.warn(`Table '${tableName}' has invalid columns:`, columns);
                        }
                    }
                }
                allSuggestions = [...allSuggestions, ...schemaItems, ...tableItems, ...columnItems];
            };

            //TODO: Implement a better way to handle the completion items
            lastWord = null;
            lastType = null;
            monaco.languages.registerCompletionItemProvider('sql', {
                triggerCharacters: ['.', ' '],
                provideCompletionItems: (model, position) => {
                    const textUntilPosition = model.getValueInRange({
                        startLineNumber: position.lineNumber,
                        startColumn: 1,
                        endLineNumber: position.lineNumber,
                        endColumn: position.column
                    });

                    const word = model.getWordUntilPosition(position);
                    const range = {
                        startLineNumber: position.lineNumber,
                        endLineNumber: position.lineNumber,
                        startColumn: word.startColumn,
                        endColumn: word.endColumn
                    };

                    // Extract tokens before cursor
                    const tokens = textUntilPosition.trim().split(/\s+/);
                    const lastToken = tokens[tokens.length - 1] || '';

                    // Handle schema.table.column
                    const dotParts = lastToken.split('.');
                    if (dotParts.length === 1) {
                        // Suggest keywords + schemas
                        return {
                            suggestions: [...sqlKeywords, ...schemaItems].map(s => ({
                                label: s.label,
                                kind: s.kind,
                                insertText: s.insertText,
                                range: range
                            }))
                        };
                    } else if (dotParts.length === 2) {
                        const schemaName = dotParts[0];
                        const tables = tableItems.filter(t => t.label.startsWith(`${schemaName}.`));
                        return {
                            suggestions: tables.map(s => ({
                                label: s.label.split('.')[1], // Show only table name
                                kind: s.kind,
                                insertText: s.insertText,
                                range: range
                            }))
                        };
                    } else if (dotParts.length === 3) {
                        const [schemaName, tableName] = dotParts;
                        const columns = columnItems.filter(c => c.label.startsWith(`${schemaName}.${tableName}.`));
                        return {
                            suggestions: columns.map(s => ({
                                label: s.label.split('.')[2], // Show only column name
                                kind: s.kind,
                                insertText: s.insertText,
                                range: range
                            }))
                        };
                    }

                    return {
                        suggestions: allSuggestions.map(s => ({
                            label: s.label,
                            kind: s.kind,
                            insertText: s.insertText,
                            range: range
                        }))
                    };
                }
            });

            // Add F5 key handler to prevent refresh and signal PowerShell to execute query
            editor.addCommand(monaco.KeyCode.F5, function() {
                console.log('F5 pressed in Monaco Editor - signaling PowerShell to execute query');

                var selection = editor.getSelection();
                var hasSelection = selection && !selection.isEmpty();
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'executeQuery',
                        key: 'F5',
                        hasSelection: hasSelection,
                        selectedText: hasSelection ? editor.getModel().getValueInRange(selection) : null
                    });
                }

                // Prevent the editor from handling F5 internally
                return false;
            });

            // Also handle Ctrl+F5 as an alternative shortcut
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.F5, function() {
                console.log('Ctrl+F5 pressed in Monaco Editor - signaling PowerShell to execute query');

                var selection = editor.getSelection();
                var hasSelection = selection && !selection.isEmpty();
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'executeQuery',
                        key: 'Ctrl+F5',
                        hasSelection: hasSelection,
                        selectedText: hasSelection ? editor.getModel().getValueInRange(selection) : null
                    });
                }

                return false;
            });

            // Add Ctrl+S handler for saving queries
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function() {
                console.log('Ctrl+S pressed in Monaco Editor - signaling PowerShell to save query');

                // Send message to PowerShell to save query
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'saveQuery',
                        key: 'Ctrl+S'
                    });
                }

                return false;
            });

            // Also add a global keydown event listener as backup
            document.addEventListener('keydown', function(event) {
                if (event.key === 'F5') {
                    console.log('F5 intercepted by document keydown listener');
                    event.preventDefault();
                    event.stopPropagation();

                    var selection = typeof editor !== 'undefined' && editor ? editor.getSelection() : null;
                    var hasSelection = selection && !selection.isEmpty();
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage({
                            type: 'executeQuery',
                            key: 'F5_global',
                            hasSelection: hasSelection,
                            selectedText: hasSelection ? editor.getModel().getValueInRange(selection) : null
                        });
                    }

                    return false;
                }
                else if (event.key === 's' && event.ctrlKey) {
                    console.log('Ctrl+S intercepted by document keydown listener');
                    event.preventDefault();
                    event.stopPropagation();

                    // Send message to PowerShell to save query
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage({
                            type: 'saveQuery',
                            key: 'Ctrl+S_global'
                        });
                    }

                    return false;
                }
            }, true); // Use capture phase to intercept early

        });
    </script>
</body>

</html>
