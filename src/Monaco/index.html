<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor</title>
    <script src="./min/vs/loader.js"></script>
    <style>
        html,
        body,
        #editor {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="editor"></div>
    <script>
        require.config({ paths: { 'vs': './min/vs' } });
        require(['vs/editor/editor.main', 'vs/basic-languages/sql/sql'], function (monaco, sql) {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: [].join('\n'),
                language: 'sql',
                automaticLayout: true,
                wordWrap: 'on',
                minimap: {
                    enabled: false
                }
            });

            // Programmatic loads (restoring a saved query, clearing on disconnect) must not be
            // reported as an unsaved change - only genuine user edits should. Callers set the
            // editor's content via window.setEditorValue(...) instead of editor.setValue(...)
            // directly so this distinction can be made.
            window.__suppressDirty = false;
            window.setEditorValue = function (value) {
                window.__suppressDirty = true;
                try {
                    editor.setValue(value);
                }
                finally {
                    window.__suppressDirty = false;
                }
            };
            editor.onDidChangeModelContent(function () {
                if (!window.__suppressDirty) {
                    window.chrome.webview.postMessage({ type: 'contentChanged' });
                }
            });

            // ---- Static suggestion pools (built once) -------------------------------

            // T-SQL keywords shipped with the bundled sql basic-language.
            const keywordItems = sql.language.keywords.map(keyword => ({
                label: keyword.toUpperCase(),
                kind: monaco.languages.CompletionItemKind.Keyword,
                insertText: keyword.toUpperCase(),
                detail: 'keyword',
                sortText: `3_${keyword}`
            }));

            // T-SQL built-in functions shipped with the bundled sql basic-language
            // (reused instead of hand-rolling a function list).
            const functionItems = (sql.language.builtinFunctions || []).map(fn => ({
                label: fn.toUpperCase(),
                kind: monaco.languages.CompletionItemKind.Function,
                insertText: fn.toUpperCase(),
                detail: 'function',
                sortText: `4_${fn}`
            }));

            // Hand-authored snippets. insertTextRules marks them as snippets so ${1:..} become tab stops.
            const snippetItems = [
                {
                    label: 'SELECT … FROM',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'SELECT ${1:*}\nFROM ${2:table}\nWHERE ${3:condition}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    detail: 'snippet',
                    documentation: 'SELECT ... FROM ... WHERE ...',
                    sortText: '2_select'
                },
                {
                    label: 'JOIN … ON',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'JOIN ${1:table} ${2:alias} ON ${3:condition}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    detail: 'snippet',
                    documentation: 'JOIN ... ON ...',
                    sortText: '2_join'
                },
                {
                    label: 'CASE WHEN',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'CASE\n\tWHEN ${1:condition} THEN ${2:result}\n\tELSE ${3:default}\nEND',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    detail: 'snippet',
                    documentation: 'CASE WHEN ... THEN ... ELSE ... END',
                    sortText: '2_case'
                },
                {
                    label: 'GROUP BY',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'GROUP BY ${1:column}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    detail: 'snippet',
                    sortText: '2_groupby'
                },
                {
                    label: 'ORDER BY',
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: 'ORDER BY ${1:column} ${2:ASC}',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    detail: 'snippet',
                    sortText: '2_orderby'
                }
            ];

            // ---- Schema model (populated by setSchema) ------------------------------

            // Normalised model, keyed by the schema's own casing:
            //   { schemaName: { tableName: [ { name, type }, ... ] } }
            let schemaModel = {};
            let schemaItems = [];   // one per schema  (kind Struct)
            let tableItems = [];    // one per table   (kind Class,  label "schema.table")
            let allSuggestions = [...keywordItems, ...functionItems, ...snippetItems];

            // T-SQL identifiers are case-insensitive, but the model above is keyed by the exact
            // casing the server reported. These indexes map what the user typed (any casing) back to
            // the canonical name, so "FROM DBO.Person p" still resolves "p." to Person's columns.
            let schemaNameIndex = {};    // lower(schema) -> canonical schema
            let tableNameIndex = {};     // lower(schema) -> { lower(table) -> canonical table }
            let tablesByLowerName = {};  // lower(table)  -> [ { schema, table } ] (canonical)

            // A candidate alias that is actually one of these clause keywords is not an alias
            // (e.g. "FROM dbo.Person WHERE ..." must not treat WHERE as the table's alias).
            const reservedAfterTable = new Set([
                'ON', 'WHERE', 'INNER', 'LEFT', 'RIGHT', 'FULL', 'OUTER', 'CROSS', 'JOIN',
                'GROUP', 'ORDER', 'HAVING', 'UNION', 'AS', 'AND', 'OR'
            ]);

            // Accept a column as either "name" (legacy, name only) or { n, t } / { name, type }.
            function normalizeColumn(col) {
                if (typeof col === 'string') {
                    return { name: col, type: '' };
                }
                if (col && typeof col === 'object') {
                    return {
                        name: col.n !== undefined ? col.n : (col.name !== undefined ? col.name : ''),
                        type: col.t !== undefined ? col.t : (col.type !== undefined ? col.type : '')
                    };
                }
                return { name: String(col), type: '' };
            }

            function rebuildSchema(schema) {
                // Reset everything on every call so reconnect/refresh never duplicates suggestions.
                schemaModel = {};
                schemaItems = [];
                tableItems = [];
                schemaNameIndex = {};
                tableNameIndex = {};
                tablesByLowerName = {};

                for (const schemaName in schema) {
                    schemaModel[schemaName] = {};
                    schemaNameIndex[schemaName.toLowerCase()] = schemaName;
                    tableNameIndex[schemaName.toLowerCase()] = {};
                    schemaItems.push({
                        label: schemaName,
                        kind: monaco.languages.CompletionItemKind.Struct,
                        insertText: schemaName,
                        detail: 'schema',
                        sortText: `1_${schemaName}`
                    });

                    const tables = schema[schemaName];
                    for (const tableName in tables) {
                        const rawColumns = tables[tableName];
                        const columns = Array.isArray(rawColumns) ? rawColumns.map(normalizeColumn) : [];
                        schemaModel[schemaName][tableName] = columns;
                        tableNameIndex[schemaName.toLowerCase()][tableName.toLowerCase()] = tableName;

                        const lowerTable = tableName.toLowerCase();
                        if (!tablesByLowerName[lowerTable]) {
                            tablesByLowerName[lowerTable] = [];
                        }
                        tablesByLowerName[lowerTable].push({ schema: schemaName, table: tableName });

                        tableItems.push({
                            label: `${schemaName}.${tableName}`,
                            kind: monaco.languages.CompletionItemKind.Class,
                            // Schema-qualified: this is what a FROM/JOIN position inserts, so the
                            // statement is valid regardless of the connection's default schema. The
                            // "schema." (DOT_TABLE) position inserts schemaName/tableName instead,
                            // because the schema is already typed there.
                            insertText: `${schemaName}.${tableName}`,
                            detail: 'table',
                            sortText: `1_${schemaName}.${tableName}`,
                            schemaName: schemaName,
                            tableName: tableName
                        });
                    }
                }

                // Columns are context-scoped, so they are intentionally NOT in the generic pool.
                allSuggestions = [
                    ...keywordItems, ...functionItems, ...snippetItems,
                    ...schemaItems, ...tableItems
                ];
            }

            window.setSchema = function (schema) {
                rebuildSchema(schema || {});
            };

            // ---- Diagnostics channel ------------------------------------------------
            //
            // ONE channel for every validation pass, mirroring the setSchema/setEditorValue seam:
            // all analysis stays in PowerShell (where Pester can reach it) and the editor stays a
            // pure renderer. The T-SQL syntax pass pushes severity 'Error'; the schema pass added
            // later pushes severity 'Warning' with its own 'source', and needs no change here.
            //
            // Markers live in the model only. They are never persisted with the tab session, and
            // nothing on this side sends the query text anywhere.
            const diagnosticSeverity = {
                error: monaco.MarkerSeverity.Error,
                warning: monaco.MarkerSeverity.Warning,
                info: monaco.MarkerSeverity.Info,
                hint: monaco.MarkerSeverity.Hint
            };

            window.setDiagnostics = function (diagnostics) {
                const model = editor.getModel();
                if (!model) {
                    return;
                }

                // An empty or missing list clears the markers, which is how a script that has
                // become valid again loses its squiggles.
                const markers = (diagnostics || []).map(function (diagnostic) {
                    // Unknown severities fall back to Warning rather than being dropped: a
                    // diagnostic the user cannot see is worse than one shown at the wrong weight.
                    const severity = diagnosticSeverity[String(diagnostic.severity || '').toLowerCase()]
                        || monaco.MarkerSeverity.Warning;

                    return {
                        startLineNumber: diagnostic.line,
                        startColumn: diagnostic.column,
                        endLineNumber: diagnostic.endLine || diagnostic.line,
                        endColumn: diagnostic.endColumn || (diagnostic.column + 1),
                        message: diagnostic.message,
                        source: diagnostic.source,
                        severity: severity
                    };
                });

                monaco.editor.setModelMarkers(model, 'omada-sql', markers);
            };

            // Map a typed schema name (any casing) onto its canonical name, or null when unknown.
            function resolveSchemaName(name) {
                if (!name) {
                    return null;
                }
                return schemaNameIndex[String(name).toLowerCase()] || null;
            }

            function isSchema(name) {
                return resolveSchemaName(name) !== null;
            }

            // Resolve a (possibly unqualified, any-casing) table reference onto canonical
            // { schema, table }. Returns null when the table is unknown, or when a bare name is
            // ambiguous across schemas - callers must skip those rather than guess a schema.
            function resolveTableRef(schemaName, tableName) {
                if (!tableName) {
                    return null;
                }
                if (schemaName) {
                    const canonicalSchema = resolveSchemaName(schemaName);
                    if (!canonicalSchema) {
                        return null;
                    }
                    const canonicalTable = tableNameIndex[canonicalSchema.toLowerCase()][String(tableName).toLowerCase()];
                    return canonicalTable ? { schema: canonicalSchema, table: canonicalTable } : null;
                }

                const candidates = tablesByLowerName[String(tableName).toLowerCase()] || [];
                if (candidates.length === 0) {
                    return null;
                }
                // An unqualified name resolves to dbo when dbo owns it (SQL Server's usual default
                // schema); otherwise only a single owner is unambiguous enough to resolve.
                const dboOwned = candidates.filter(c => c.schema.toLowerCase() === 'dbo')[0];
                if (dboOwned) {
                    return dboOwned;
                }
                return candidates.length === 1 ? candidates[0] : null;
            }

            function columnsFor(schemaName, tableName) {
                const ref = resolveTableRef(schemaName, tableName);
                if (!ref) {
                    return [];
                }
                return schemaModel[ref.schema][ref.table] || [];
            }

            // Parse FROM/JOIN table references from a statement into an alias map + tables in scope.
            function parseTableRefs(stmt) {
                const aliasMap = {};      // aliasLower -> { schema, table }
                const tablesInScope = []; // [ { schema, table } ]
                const seen = new Set();
                const re = /\b(?:FROM|JOIN)\s+(?:(\w+)\.)?(\w+)(?:\s+(?:AS\s+)?(\w+))?/gi;
                let m;
                while ((m = re.exec(stmt)) !== null) {
                    const explicitSchema = m[1];
                    const table = m[2];
                    let alias = m[3];

                    // Skip anything that does not resolve to a real table (a typo, a CTE/temp table,
                    // a half-typed "FROM schema.", or a bare name owned by several schemas). Guessing
                    // a schema here would attach the alias to a table that does not exist.
                    const ref = resolveTableRef(explicitSchema, table);
                    if (!ref) {
                        continue;
                    }

                    // A trailing clause keyword is not an alias (e.g. "FROM dbo.Person WHERE ...").
                    if (alias && reservedAfterTable.has(alias.toUpperCase())) {
                        alias = null;
                    }

                    if (alias) {
                        aliasMap[alias.toLowerCase()] = ref;
                    }
                    // Register the bare table name too, so "Person." works without an explicit alias.
                    aliasMap[table.toLowerCase()] = ref;

                    const key = `${ref.schema}.${ref.table}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        tablesInScope.push(ref);
                    }
                }
                return { aliasMap, tablesInScope };
            }

            const clauseKeywords = ['ORDER BY', 'GROUP BY', 'HAVING', 'WHERE', 'FROM', 'JOIN', 'ON', 'SELECT'];
            const tableClauses = new Set(['FROM', 'JOIN']);
            const columnClauses = new Set(['SELECT', 'WHERE', 'ON', 'GROUP BY', 'ORDER BY', 'HAVING']);

            // Decide what to suggest at the cursor. Returns { mode, schema?, table?, tablesInScope }.
            function detectContext(model, position) {
                const fullText = model.getValue();
                const offset = model.getOffsetAt(position);

                // Scope to the current statement (between the surrounding ';' delimiters). Aliases are
                // parsed from the whole statement (both sides of the cursor) so "SELECT p.| FROM x p"
                // resolves; clause/dot detection only looks at text left of the cursor.
                const stmtStart = fullText.lastIndexOf(';', offset - 1) + 1;
                let stmtEnd = fullText.indexOf(';', offset);
                if (stmtEnd === -1) { stmtEnd = fullText.length; }
                const fullStmt = fullText.slice(stmtStart, stmtEnd);
                const stmtBefore = fullText.slice(stmtStart, offset);

                const refs = parseTableRefs(fullStmt);

                // --- Dot chains are unambiguous: handle them before clause detection. ---
                const chainMatch = stmtBefore.match(/([\w.]*)$/);
                const chain = chainMatch ? chainMatch[1] : '';
                if (chain.indexOf('.') !== -1) {
                    const parts = chain.split('.');
                    if (parts.length === 2) {
                        // "x." - x is a schema, an alias, or a bare table. Check schema first: a
                        // dangling "FROM schema." otherwise gets mis-parsed as a table reference.
                        const head = parts[0];
                        if (isSchema(head)) {
                            return { mode: 'DOT_TABLE', schema: resolveSchemaName(head), tablesInScope: refs.tablesInScope };
                        }
                        const ref = refs.aliasMap[head.toLowerCase()];
                        if (ref) {
                            return { mode: 'DOT_COLUMN', schema: ref.schema, table: ref.table, tablesInScope: refs.tablesInScope };
                        }
                        return { mode: 'NONE', tablesInScope: refs.tablesInScope };
                    }
                    if (parts.length >= 3) {
                        // "schema.table." - take the two segments before the trailing dot.
                        const ref = resolveTableRef(parts[parts.length - 3], parts[parts.length - 2]);
                        if (!ref) {
                            return { mode: 'NONE', tablesInScope: refs.tablesInScope };
                        }
                        return { mode: 'DOT_COLUMN', schema: ref.schema, table: ref.table, tablesInScope: refs.tablesInScope };
                    }
                }

                // --- Clause detection: find the last clause keyword before the cursor. ---
                const upper = stmtBefore.toUpperCase();
                let bestClause = null;
                let bestIndex = -1;
                clauseKeywords.forEach(kw => {
                    const re = new RegExp(`\\b${kw.replace(' ', '\\s+')}\\b`, 'g');
                    let mm;
                    let last = -1;
                    while ((mm = re.exec(upper)) !== null) {
                        last = mm.index;
                    }
                    if (last > bestIndex) {
                        bestIndex = last;
                        bestClause = kw;
                    }
                });

                if (bestClause && tableClauses.has(bestClause)) {
                    return { mode: 'TABLE', tablesInScope: refs.tablesInScope };
                }
                if (bestClause && columnClauses.has(bestClause)) {
                    return { mode: 'COLUMN', tablesInScope: refs.tablesInScope };
                }
                return { mode: 'DEFAULT', tablesInScope: refs.tablesInScope };
            }

            monaco.languages.registerCompletionItemProvider('sql', {
                triggerCharacters: ['.', ' '],
                provideCompletionItems: (model, position) => {
                    const word = model.getWordUntilPosition(position);
                    const range = {
                        startLineNumber: position.lineNumber,
                        endLineNumber: position.lineNumber,
                        startColumn: word.startColumn,
                        endColumn: word.endColumn
                    };

                    // Attach the replacement range and copy through completion fields.
                    const withRange = list => list.map(s => ({
                        label: s.label,
                        kind: s.kind,
                        insertText: s.insertText,
                        insertTextRules: s.insertTextRules,
                        detail: s.detail,
                        documentation: s.documentation,
                        sortText: s.sortText,
                        range: range
                    }));

                    const ctx = detectContext(model, position);

                    // Unknown "x." with no matching alias/table/schema: nothing sensible to offer.
                    if (ctx.mode === 'NONE') {
                        return { suggestions: [] };
                    }

                    // "alias." / "schema.table." -> that table's columns.
                    if (ctx.mode === 'DOT_COLUMN') {
                        const cols = columnsFor(ctx.schema, ctx.table).map(c => ({
                            label: c.name,
                            kind: monaco.languages.CompletionItemKind.Field,
                            insertText: c.name,
                            detail: c.type || 'column',
                            sortText: `0_${c.name}`
                        }));
                        return { suggestions: withRange(cols) };
                    }

                    // "schema." -> that schema's tables. The schema is already typed here, so both the
                    // label and the inserted text are the bare table name.
                    if (ctx.mode === 'DOT_TABLE') {
                        const tables = tableItems
                            .filter(t => t.schemaName === ctx.schema)
                            .map(t => ({
                                label: t.tableName,
                                kind: t.kind,
                                insertText: t.tableName,
                                detail: t.detail,
                                sortText: `0_${t.tableName}`
                            }));
                        return { suggestions: withRange(tables) };
                    }

                    // FROM / JOIN position -> tables and schemas (not columns/keywords).
                    if (ctx.mode === 'TABLE') {
                        return { suggestions: withRange([...tableItems, ...schemaItems]) };
                    }

                    // SELECT / WHERE / ON / GROUP BY / ORDER BY -> columns of tables in scope.
                    if (ctx.mode === 'COLUMN') {
                        const cols = [];
                        const seen = new Set();
                        ctx.tablesInScope.forEach(ref => {
                            columnsFor(ref.schema, ref.table).forEach(c => {
                                const key = `${ref.schema}.${ref.table}.${c.name}`;
                                if (seen.has(key)) { return; }
                                seen.add(key);
                                cols.push({
                                    label: c.name,
                                    kind: monaco.languages.CompletionItemKind.Field,
                                    insertText: c.name,
                                    detail: `${c.type || 'column'} · ${ref.table}`,
                                    sortText: `0_${c.name}`
                                });
                            });
                        });
                        if (cols.length === 0) {
                            // No table resolved yet (e.g. "SELECT |" before FROM): fall back to everything.
                            return { suggestions: withRange(allSuggestions) };
                        }
                        // Columns first, then functions (valid in SELECT/WHERE) ranked below.
                        const fns = functionItems.map(f => Object.assign({}, f, { sortText: `5_${f.label}` }));
                        return { suggestions: withRange([...cols, ...fns]) };
                    }

                    // DEFAULT: keywords + functions + snippets + schemas + tables.
                    return { suggestions: withRange(allSuggestions) };
                }
            });

            // Add F5 key handler to prevent refresh and signal PowerShell to execute query
            editor.addCommand(monaco.KeyCode.F5, function() {
                console.log('F5 pressed in Monaco Editor - signaling PowerShell to execute query');

                var selection = editor.getSelection();
                var hasSelection = selection && !selection.isEmpty();
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'executeQuery',
                        key: 'F5',
                        hasSelection: hasSelection,
                        selectedText: hasSelection ? editor.getModel().getValueInRange(selection) : null
                    });
                }

                // Prevent the editor from handling F5 internally
                return false;
            });

            // Also handle Ctrl+F5 as an alternative shortcut
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.F5, function() {
                console.log('Ctrl+F5 pressed in Monaco Editor - signaling PowerShell to execute query');

                var selection = editor.getSelection();
                var hasSelection = selection && !selection.isEmpty();
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'executeQuery',
                        key: 'Ctrl+F5',
                        hasSelection: hasSelection,
                        selectedText: hasSelection ? editor.getModel().getValueInRange(selection) : null
                    });
                }

                return false;
            });

            // Add Ctrl+S handler for saving queries
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function() {
                console.log('Ctrl+S pressed in Monaco Editor - signaling PowerShell to save query');

                // Send message to PowerShell to save query
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'saveQuery',
                        key: 'Ctrl+S'
                    });
                }

                return false;
            });

            // Also add a global keydown event listener as backup
            document.addEventListener('keydown', function(event) {
                if (event.key === 'F5') {
                    console.log('F5 intercepted by document keydown listener');
                    event.preventDefault();
                    event.stopPropagation();

                    var selection = typeof editor !== 'undefined' && editor ? editor.getSelection() : null;
                    var hasSelection = selection && !selection.isEmpty();
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage({
                            type: 'executeQuery',
                            key: 'F5_global',
                            hasSelection: hasSelection,
                            selectedText: hasSelection ? editor.getModel().getValueInRange(selection) : null
                        });
                    }

                    return false;
                }
                else if (event.key === 's' && event.ctrlKey) {
                    console.log('Ctrl+S intercepted by document keydown listener');
                    event.preventDefault();
                    event.stopPropagation();

                    // Send message to PowerShell to save query
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage({
                            type: 'saveQuery',
                            key: 'Ctrl+S_global'
                        });
                    }

                    return false;
                }
            }, true); // Use capture phase to intercept early

        });
    </script>
</body>

</html>
