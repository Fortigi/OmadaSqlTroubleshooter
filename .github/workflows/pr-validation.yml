name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install modules
        shell: pwsh
        run: ./Build/InstallModules.ps1

      - name: Analyze, test and build
        shell: pwsh
        run: ./Build/build.ps1 -Task TestBuildOnly -BuildVersion '0.0.0'

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pester Tests
          path: buildoutput/TestResults.xml
          reporter: java-junit
