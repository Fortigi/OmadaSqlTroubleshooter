name: PR Validation

# Runs on `issue_comment`, so GITHUB_SHA / github.ref always point at the default
# branch, never at the PR being validated. Everything that identifies the PR has to
# come from `needs.dispatch.outputs.head_sha` — never from the ambient github context —
# otherwise concurrent validations of different PRs all report against main.
run-name: >-
  ${{ github.event_name == 'issue_comment'
  && format('PR Validation #{0} — {1}', github.event.issue.number, github.event.issue.title)
  || format('PR Validation — {0}', github.ref_name) }}

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

# Keyed on the PR number so validations of *different* PRs run in parallel, while a
# second /validate on the same PR supersedes the first instead of racing it to write
# the commit status.
concurrency:
  group: pr-validation-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

# Every job below declares its own permissions: block, each scoped to only the API calls that job
# actually makes - a job-level block fully replaces this one rather than narrowing it, so leaving
# a broad grant here would be dead weight that only widens the default for a future job that
# forgets to declare its own.
permissions: {}

jobs:
  dispatch:
    name: Dispatch
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/validate'))
    # Narrower than the workflow-level grant above: this job only reads the PR, reacts to the
    # triggering comment and writes the pending commit status - it never checks anything out and
    # never touches a check run.
    permissions:
      pull-requests: read
      issues: write
      statuses: write
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve trigger context
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_run', 'true');
              core.setOutput('head_sha', context.sha);
              return;
            }

            const allowedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const association = context.payload.comment.author_association;
            if (!allowedAssociations.includes(association)) {
              core.warning(`Comment author association '${association}' is not authorized to trigger validation.`);
              core.setOutput('should_run', 'false');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('should_run', 'true');
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Set pending status
        if: steps.resolve.outputs.should_run == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.resolve.outputs.head_sha }}',
              state: 'pending',
              context: 'PR Validation',
              description: 'Validation running...',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Acknowledge comment
        if: github.event_name == 'issue_comment' && steps.resolve.outputs.should_run == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

  validate:
    name: Validate
    needs: dispatch
    if: needs.dispatch.outputs.should_run == 'true'
    runs-on: windows-latest
    # Narrower than the workflow-level grant above: this job checks out the PR head and publishes
    # a check run for its own Pester results - nothing here touches a PR, an issue or a status.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.dispatch.outputs.head_sha }}
          fetch-depth: 0

      - name: Check branch is up to date with main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Error "This branch is behind 'main'. Please merge or rebase 'main' into your branch and push again."
            exit 1
          }
          Write-Host "Branch is up to date with main."

      - name: Determine changed files
        run: |
          $baseSha = git merge-base origin/main HEAD
          $files = git diff --name-only $baseSha ${{ needs.dispatch.outputs.head_sha }}
          $joined = ($files -join ';')
          "PR_CHANGED_FILES=$joined" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install modules
        run: ./build/InstallModules.ps1

      # Unlike the psake task, this runs without -SkipDownload, so it also re-hashes what the pinned
      # URL actually serves today.
      - name: Verify dependency lock
        run: ./build/Update-DependencyLock.ps1 -Check

      - name: Analyze, test and build
        run: ./build/build.ps1 -Task TestBuildOnly -BuildVersion '0.0.0'

      - name: Check for test results
        id: test-results
        if: always()
        run: |
          $exists = Test-Path 'buildoutput/TestResults.xml'
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Reduce the JUnit report Pester emits to a small JSON summary.
      - name: Summarize test results
        id: summarize
        if: always() && steps.test-results.outputs.exists == 'True'
        run: |
          [xml]$doc = Get-Content -LiteralPath 'buildoutput/TestResults.xml' -Raw

          $cases = $doc.SelectNodes('//testcase')
          $failures = @()
          $skipped = 0
          foreach ($case in $cases) {
            $failure = $case.SelectSingleNode('failure')
            if ($null -ne $failure) {
              $failures += [PSCustomObject]@{
                name    = '{0}.{1}' -f $case.GetAttribute('classname'), $case.GetAttribute('name')
                message = $failure.GetAttribute('message')
                details = $failure.InnerText
              }
              continue
            }
            if ($null -ne $case.SelectSingleNode('skipped')) { $skipped++ }
          }

          $summary = [PSCustomObject]@{
            total    = $cases.Count
            failed   = $failures.Count
            skipped  = $skipped
            passed   = $cases.Count - $failures.Count - $skipped
            failures = @($failures | Select-Object -First 50)
          }

          $json = $summary | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("$PWD/buildoutput/TestSummary.json", $json)
          Write-Host "Tests: $($summary.passed) passed, $($summary.failed) failed, $($summary.skipped) skipped."

      # dorny/test-reporter is deliberately not used here — v1 and v3 alike. Neither has
      # a head-sha input, and both resolve the commit as
      # `payload.pull_request?.head.sha ?? github.sha`. An
      # issue_comment payload carries `issue.pull_request`, not `pull_request`, so it
      # falls back to github.sha — the tip of main. Every PR's report landed on the same
      # main commit under the same check name, so no PR showed its own results and
      # simultaneous validations were indistinguishable. Create the check ourselves,
      # against the PR head this run actually validated.
      - name: Publish test results
        # Gated on the summarize step rather than on the XML existing: if summarization
        # failed there is no TestSummary.json, and the reader's ENOENT would bury the
        # real error.
        if: always() && steps.summarize.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('buildoutput/TestSummary.json', 'utf8').replace(/^\uFEFF/, '');
            const result = JSON.parse(raw);

            // ConvertTo-Json collapses a single-element array to a bare object.
            const failures = Array.isArray(result.failures)
              ? result.failures
              : (result.failures ? [result.failures] : []);

            const lines = [
              `**${result.passed} passed** · **${result.failed} failed** · **${result.skipped} skipped** (${result.total} total)`,
              '',
              `Validated \`${{ needs.dispatch.outputs.head_sha }}\`.`
            ];
            for (const failure of failures) {
              lines.push('', `### ❌ ${failure.name}`, '', '```',
                `${failure.message || ''}\n${failure.details || ''}`.trim(), '```');
            }
            if (result.failed > failures.length) {
              lines.push('', `_… and ${result.failed - failures.length} more failures._`);
            }
            const summary = lines.join('\n').slice(0, 65000);

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Pester Tests (pwsh)',
              head_sha: '${{ needs.dispatch.outputs.head_sha }}',
              status: 'completed',
              conclusion: result.failed > 0 ? 'failure' : 'success',
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: `${result.passed}/${result.total} passed`,
                summary
              }
            });

            await core.summary.addRaw(summary).write();

  report-status:
    name: Report status
    needs: [dispatch, validate]
    # `!cancelled()` matters: when a newer /validate supersedes this run, the cancelled
    # run must not overwrite the status the newer run is already writing for the same SHA.
    if: always() && !cancelled() && needs.dispatch.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Narrower than the workflow-level grant above: this job only writes the final commit status.
    permissions:
      statuses: write
    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set final commit status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const success = '${{ needs.validate.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.dispatch.outputs.head_sha }}',
              state: success ? 'success' : 'failure',
              context: 'PR Validation',
              description: success ? 'Validation passed' : 'Validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
