name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch: {}

permissions: {}

jobs:
  build:
    name: Build
    runs-on: windows-latest

    permissions:
      contents: read
      checks: write

    outputs:
      build_version: ${{ steps.versioning.outputs.build_version }}
      year: ${{ steps.versioning.outputs.year }}

    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install modules
        shell: pwsh
        run: ./build/InstallModules.ps1

      # Runs without -SkipDownload, so it re-hashes what the pinned URL actually serves before a
      # release is cut.
      - name: Verify dependency lock
        shell: pwsh
        run: ./build/Update-DependencyLock.ps1 -Check

      - name: Generate version number
        id: versioning
        shell: pwsh
        run: |
          $date     = Get-Date
          $version  = '{0:d4}.{1:d2}.{2:d2}.{3}' -f $date.Year, $date.Month, $date.Day, ${{ github.run_number }}
          "build_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "year=$($date.Year)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Analyze, test and build
        shell: pwsh
        run: |
          ./build/build.ps1 -Task TestBuildOnly -BuildVersion '${{ steps.versioning.outputs.build_version }}'

      - name: Check for test results
        id: test-results
        if: always()
        shell: pwsh
        run: |
          $exists = Test-Path 'buildoutput/TestResults.xml'
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && steps.test-results.outputs.exists == 'True'
        with:
          name: Pester Tests (Release)
          path: buildoutput/TestResults.xml
          reporter: java-junit

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BuildOutput
          path: buildoutput/

  release:
    name: Package and Draft Release
    runs-on: windows-latest
    needs: build
    # Only runs when someone manually triggers this workflow (Run workflow), never on a plain push
    # to main. It pushes the tag and creates a DRAFT release with the package attached; nothing is
    # public until a maintainer publishes that draft, which notifies followers and starts
    # publish-psgallery.yml. The "release" environment (and its approval gate) sits on that publish
    # job, the one that uses the PowerShell Gallery key.
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    env:
      BUILD_VERSION: ${{ needs.build.outputs.build_version }}
      YEAR: ${{ needs.build.outputs.year }}

    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BuildOutput
          path: buildoutput/

      - name: Pack NuGet package
        shell: pwsh
        run: |
          nuget pack OmadaSqlTroubleshooter.nuspec `
            -Version '${{ env.BUILD_VERSION }}' `
            -Properties "VERSION=${{ env.BUILD_VERSION }};YEAR=${{ env.YEAR }}" `
            -OutputDirectory staging/

      - name: Find last non-nightly release tag
        id: prev_tag
        shell: bash
        run: |
          PREV_TAG=$(git tag -l 'v*' | grep -v -- '-nightly$' | sort -V | tail -n 1)
          echo "Previous non-nightly tag: ${PREV_TAG:-<none>}"
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        shell: pwsh
        run: |
          git config user.email "devops@fortigi.nl"
          git config user.name "GitHub Actions"
          git tag -a "v${{ env.BUILD_VERSION }}" -m "Release version ${{ env.BUILD_VERSION }}"
          git push origin "refs/tags/v${{ env.BUILD_VERSION }}"

      # Created as a draft so the generated release notes can be reviewed and edited before the
      # release goes public. A draft is only visible to users with write access and sends no
      # notifications; watchers are notified when a maintainer publishes it from the Releases page,
      # and publishing it starts publish-psgallery.yml, which pushes this exact .nupkg to the
      # PowerShell Gallery. The tag is pushed by the previous step, so it exists independently of
      # the draft.
      - name: Create GitHub Release (draft)
        id: gh_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: Release v${{ env.BUILD_VERSION }}
          files: staging/*.nupkg
          draft: true
          generate_release_notes: true
          previous_tag: ${{ steps.prev_tag.outputs.previous_tag }}

      - name: Report draft release
        shell: pwsh
        env:
          RELEASE_URL: ${{ steps.gh_release.outputs.url }}
        run: |
          @(
            "## Draft release v$env:BUILD_VERSION created"
            ''
            "Review and edit the release notes, then publish the draft: $env:RELEASE_URL"
            ''
            'Publishing the draft notifies watchers and starts the PowerShell Gallery publish (Publish to PSGallery workflow).'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
