name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch: {}

permissions: {}

jobs:
  build:
    name: Build
    runs-on: windows-latest

    permissions:
      contents: read
      checks: write

    outputs:
      build_version: ${{ steps.versioning.outputs.build_version }}
      year: ${{ steps.versioning.outputs.year }}

    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install modules
        shell: pwsh
        run: ./build/InstallModules.ps1

      # Runs without -SkipDownload, so it re-hashes what the pinned URL actually serves before a
      # release is cut.
      - name: Verify dependency lock
        shell: pwsh
        run: ./build/Update-DependencyLock.ps1 -Check

      - name: Generate version number
        id: versioning
        shell: pwsh
        run: |
          $date     = Get-Date
          $version  = '{0:d4}.{1:d2}.{2:d2}.{3}' -f $date.Year, $date.Month, $date.Day, ${{ github.run_number }}
          "build_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "year=$($date.Year)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Analyze, test and build
        shell: pwsh
        run: |
          ./build/build.ps1 -Task TestBuildOnly -BuildVersion '${{ steps.versioning.outputs.build_version }}'

      - name: Check for test results
        id: test-results
        if: always()
        shell: pwsh
        run: |
          $exists = Test-Path 'buildoutput/TestResults.xml'
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always() && steps.test-results.outputs.exists == 'True'
        with:
          name: Pester Tests (Release)
          path: buildoutput/TestResults.xml
          reporter: java-junit

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BuildOutput
          path: buildoutput/

  release:
    name: Package and Release
    runs-on: windows-latest
    needs: build
    # Requires the "release" GitHub Environment with required reviewers configured
    # (Settings > Environments) for the approval gate to take effect. Until that
    # is set up, this job-level condition is the actual gate: it only runs when
    # someone manually triggers this workflow (Run workflow), never on a plain
    # push to main, so publishing always needs a deliberate human action.
    if: github.event_name == 'workflow_dispatch'
    environment: release

    permissions:
      contents: write

    env:
      BUILD_VERSION: ${{ needs.build.outputs.build_version }}
      YEAR: ${{ needs.build.outputs.year }}

    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BuildOutput
          path: buildoutput/

      - name: Pack NuGet package
        shell: pwsh
        run: |
          nuget pack OmadaSqlTroubleshooter.nuspec `
            -Version '${{ env.BUILD_VERSION }}' `
            -Properties "VERSION=${{ env.BUILD_VERSION }};YEAR=${{ env.YEAR }}" `
            -OutputDirectory staging/

      - name: Find last non-nightly release tag
        id: prev_tag
        shell: bash
        run: |
          PREV_TAG=$(git tag -l 'v*' | grep -v -- '-nightly$' | sort -V | tail -n 1)
          echo "Previous non-nightly tag: ${PREV_TAG:-<none>}"
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to PSGallery
        shell: pwsh
        run: |
          ./build/PushToPsGallery.ps1 `
            -SystemDefaultWorkingDirectory '${{ github.workspace }}' `
            -PsGalleryKey '${{ secrets.PSGALLERY_API_KEY }}' `
            -BuildPath 'OmadaSqlTroubleshooter'

      - name: Create Git tag
        shell: pwsh
        run: |
          git config user.email "devops@fortigi.nl"
          git config user.name "GitHub Actions"
          git tag -a "v${{ env.BUILD_VERSION }}" -m "Release version ${{ env.BUILD_VERSION }}"
          git push origin "refs/tags/v${{ env.BUILD_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: Release v${{ env.BUILD_VERSION }}
          files: staging/*.nupkg
          generate_release_notes: true
          previous_tag: ${{ steps.prev_tag.outputs.previous_tag }}
