name: Quality gates verification (temporary, issue 109)

# TEMPORARY. Exercises the new build path on windows-latest before review: the pinned modules, the
# whole-tree build, Task QualityChanged against a simulated pull request, and Task QualityFull.
# Triggered only by pushes to this working branch; removed before the branch is proposed for merge.
on:
  push:
    branches:
      - ccr-aa024ac3-0slrcb
    paths:
      - '.github/workflows/quality-verify-temp.yml'

permissions: {}

jobs:
  verify:
    name: Verify (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install modules
        run: ./build/InstallModules.ps1

      - name: Whole-tree analyze, test and build (no PR scoping)
        id: full
        continue-on-error: true
        run: ./build/build.ps1 -Task TestBuildOnly -BuildVersion '0.0.0'

      - name: QualityChanged against a simulated pull request
        id: changed
        continue-on-error: true
        env:
          PR_CHANGED_FILES: 'src/Lib/Functions/Private/Format-QueryResultSelection.ps1;src/Lib/Functions/Private/Get-UniqueQueryName.ps1;src/Lib/Functions/Private/Initialize-WebViewForTab.ps1;README.md'
        run: ./build/build.ps1 -Task QualityChanged -BuildVersion '0.0.0'

      - name: Show the changed-code summary
        if: always()
        run: |
          $Path = 'buildoutput/quality/changed-summary.json'
          if (Test-Path $Path) { Get-Content $Path -Raw } else { 'NO changed-summary.json' }

      - name: QualityFull
        id: weekly
        continue-on-error: true
        run: ./build/build.ps1 -Task QualityFull -BuildVersion '0.0.0'

      - name: Show the weekly gates
        if: always()
        run: |
          $Path = 'buildoutput/quality/weekly.json'
          if (-not (Test-Path $Path)) { 'NO weekly.json'; return }
          $Weekly = Get-Content $Path -Raw | ConvertFrom-Json
          foreach ($Gate in $Weekly.Gates) {
            "=== {0} passed={1} metric={2} | {3}" -f $Gate.Key, $Gate.Passed, $Gate.Metric, $Gate.Title
            $Gate.Body.Substring(0, [Math]::Min(1500, $Gate.Body.Length))
          }
          "OUTCOMES full={0} changed={1} weekly={2}" -f '${{ steps.full.outcome }}', '${{ steps.changed.outcome }}', '${{ steps.weekly.outcome }}'

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QualityReports
          path: buildoutput/quality/
          if-no-files-found: warn
