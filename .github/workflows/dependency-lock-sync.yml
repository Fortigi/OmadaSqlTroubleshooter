name: Dependency Lock Sync

# Refreshes src/DependencyLock.psd1 after a version changed in build/Dependencies.
#
# The module verifies the WebView2 package it downloads against the SHA-256 pinned in the lock file,
# so a version bump is only half an update: the hash has to be recomputed from the newly published
# package. PR Validation fails while the two disagree, so this is the step that makes such a pull
# request mergeable.
#
# Run it from the Actions tab against the branch that carries the bump - typically a Dependabot
# branch - or do the same thing locally with:
#
#   ./build/Update-DependencyLock.ps1 -Refresh
#
# Not triggered by Dependabot's pull requests themselves: that would mean pull_request_target with a
# checkout of the pull request head, handing a write-scoped token to code from the branch under
# review. Instead .github/workflows/dependabot-auto-merge.yml dispatches it - on main, with the branch
# as input - for a NuGet bump that passed its reputation policy; any other bump still needs it run by
# hand. The -Check gate in PR Validation blocks an unsynced bump from merging either way.
#
# The refreshed lock file is committed through the REST contents API rather than with git push. A
# commit created that way is authored by github-actions[bot] and signed by GitHub, which is what lets
# dependabot-auto-merge.yml tell this repository's own commit from one pushed by anybody else, and
# what keeps it attributed to an account under the ruleset.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch carrying the version bump (e.g. dependabot/nuget/build/Dependencies/Microsoft.Web.WebView2-1.0.4200.10)'
        required: true
        type: string

permissions: {}

concurrency:
  group: dependency-lock-sync-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh pinned hashes
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Harden the runner (audit all outgoing network calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}

      - name: Refresh the dependency lock
        shell: pwsh
        run: ./build/Update-DependencyLock.ps1 -Refresh

      - name: Commit the refreshed lock
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          $Path = 'src/DependencyLock.psd1'
          $changed = git status --porcelain -- $Path
          if ([string]::IsNullOrWhiteSpace($changed)) {
            Write-Host "Lock file already matches the manifest; nothing to commit."
            exit 0
          }

          # The repository stores the file with LF line endings; the Windows checkout may hand it to
          # the refresh with CRLF. The API commits bytes as given, so normalise before uploading.
          $Text = [System.IO.File]::ReadAllText((Resolve-Path $Path)) -replace "`r`n", "`n"
          $Headers = @{
            Authorization          = "Bearer $env:GITHUB_TOKEN"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $Uri = 'https://api.github.com/repos/${{ github.repository }}/contents/{0}' -f $Path
          $Current = Invoke-RestMethod -Uri ('{0}?ref={1}' -f $Uri, [uri]::EscapeDataString($env:BRANCH)) -Headers $Headers
          $Body = @{
            message = 'deps: refresh pinned SHA-256 hash for the bumped package'
            content = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($Text))
            sha     = $Current.sha
            branch  = $env:BRANCH
          } | ConvertTo-Json
          $Result = Invoke-RestMethod -Method Put -Uri $Uri -Headers $Headers -Body $Body -ContentType 'application/json'
          Write-Host ("Committed {0} to {1}." -f $Result.commit.sha, $env:BRANCH)
