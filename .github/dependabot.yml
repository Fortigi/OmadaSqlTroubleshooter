# Dependabot keeps the pinned action versions used by the workflows in .github/workflows up to date,
# and - since the runtime download became pinned - the binaries the module loads as well.
#
# The four Microsoft.Web.WebView2 assemblies the module loads are downloaded to
# %LOCALAPPDATA%\OmadaSqlTroubleshooter\Bin at runtime rather than restored from a package manifest.
# They are pinned by version and SHA-256 in src/DependencyLock.psd1 and declared as a PackageReference
# in build/Dependencies, which is what puts them in this repository's dependency graph: advisories
# against a pinned version raise an alert and a security-update PR.
#
# After Dependabot bumps the version in build/Dependencies, .github/workflows/dependency-lock-sync.yml
# refreshes the matching SHA-256 in the lock file. PR validation fails while the two disagree.
#
# Cooldown. Both update blocks below wait 7 days before opening a pull request for a new version
# (3 days for a semver-patch bump), instead of the platform default of 3/3 days that GitHub made
# the default for all version updates on 14 July 2026. This is a deliberate increase, not a new
# control.
#
# What this buys, and what it does not:
#   - Dependabot *security* updates bypass cooldown entirely - a published advisory still produces
#     a pull request immediately, on both ecosystems below. So cooldown gives this repository
#     ZERO additional zero-day protection; do not read it as one.
#   - What it does buy is a window against the compromised-release pattern: a maintainer account is
#     taken over, a malicious version is published, it is detected and yanked within hours to a
#     few days. Waiting 7 days before consuming a new version means this repository is simply
#     never the one that pulled the bad release during that window.
# Given the Monday-weekly schedule, the practical cost is that a routine new version lands one
# cycle later than it otherwise would.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-patch-days: 3

  - package-ecosystem: "nuget"
    directory: "/build/Dependencies"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-patch-days: 3
